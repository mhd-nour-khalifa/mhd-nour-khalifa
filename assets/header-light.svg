<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Mohammednoor Khalifah, AI Product Engineer">
  <style>
    .name { font: 700 60px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1f2328; letter-spacing: -1.5px; }
    .title { font: 600 34px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; fill: #0969da; }
    .sub { font: 400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #59636e; }
    .num { font: 700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #1f2328; letter-spacing: -0.5px; }
    .lbl { font: 400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #59636e; }
  </style>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d1d9e0" stroke-width="1" opacity="0.5"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0969da" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0969da" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="400" rx="18"/></clipPath>
    <clipPath id="chips"><rect x="64" y="270" width="254" height="78" rx="14"/><rect x="336" y="270" width="254" height="78" rx="14"/><rect x="608" y="270" width="254" height="78" rx="14"/><rect x="880" y="270" width="254" height="78" rx="14"/></clipPath>
  </defs>
  <rect width="1200" height="400" rx="18" fill="#ffffff" stroke="#d1d9e0"/>
  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#g)"/>
    <rect width="1200" height="400" fill="url(#fade)"/>
    <rect y="397" width="260" height="3" fill="url(#scan)">
      <animate attributeName="x" from="-260" to="1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="954" cy="58" r="6" fill="#1a7f37">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="968" y="64" class="sub" style="font-size:16px">Open to remote &amp; relocation</text>

  <text x="64" y="98" class="name">Mohammednoor Khalifah</text>
  <text x="64" y="164" class="title">AI Product Engineer</text>
  <rect x="457.6" y="136" width="3" height="36" fill="#0969da">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="214" class="sub">I connect company operations to AI agents and MCP servers, and ship products people use.</text>

    <rect x="64" y="270" width="254" height="78" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="84" y="306" class="num">50%</text>
    <text x="84" y="332" class="lbl">supplier cost cut in a week</text>
    <rect x="336" y="270" width="254" height="78" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="356" y="306" class="num">1.6M+</text>
    <text x="356" y="332" class="lbl">customers at Gasable</text>
    <rect x="608" y="270" width="254" height="78" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="628" y="306" class="num">10,000+</text>
    <text x="628" y="332" class="lbl">marketplace users</text>
    <rect x="880" y="270" width="254" height="78" rx="14" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="900" y="306" class="num">138</text>
    <text x="900" y="332" class="lbl">productions on Casta</text>
  <!-- light sweep across the result cards -->
  <g clip-path="url(#chips)">
    <rect y="270" width="220" height="78" fill="url(#shine)">
      <animate attributeName="x" from="-220" to="1200" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
