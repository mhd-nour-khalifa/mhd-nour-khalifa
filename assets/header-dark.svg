<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Mohammednoor Khalifah, AI Product Engineer">
  <style>
    .name { font: 700 60px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #f0f6fc; letter-spacing: -1.5px; }
    .title { font: 600 34px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; fill: #58a6ff; }
    .sub { font: 400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8b949e; }
    .num { font: 700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #f0f6fc; letter-spacing: -0.5px; }
    .lbl { font: 400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill: #8b949e; }
    .dot { fill: #3fb950; }
  </style>
  <rect width="1200" height="400" rx="18" fill="#0d1117" stroke="#30363d"/>

  <!-- faint grid -->
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="type"><rect x="64" y="128" width="0" height="48">
      <animate attributeName="width" values="0.0;20.4;40.8;61.2;81.6;102.0;122.4;142.8;163.2;183.6;204.0;224.4;244.8;265.2;285.6;306.0;326.4;346.8;367.2;387.6" keyTimes="0.0000;0.0526;0.1053;0.1579;0.2105;0.2632;0.3158;0.3684;0.4211;0.4737;0.5263;0.5789;0.6316;0.6842;0.7368;0.7895;0.8421;0.8947;0.9474;1.0000" calcMode="discrete" begin="0.7s" dur="1.4s" fill="freeze"/>
    </rect></clipPath>
    <clipPath id="card"><rect width="1200" height="400" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#g)"/>
    <rect width="1200" height="400" fill="url(#fade)"/>
    <!-- moving scan line along the bottom edge -->
    <rect y="397" width="260" height="3" fill="url(#scan)">
      <animate attributeName="x" from="-260" to="1200" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status pill -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.5s" fill="freeze"/>
    <circle cx="954" cy="58" r="6" class="dot"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="968" y="64" class="sub" style="font-size:16px">Open to remote &amp; relocation</text>
  </g>

  <text x="64" y="98" class="name" opacity="0">Mohammednoor Khalifah
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.6s" fill="freeze"/>
  </text>

  <text x="64" y="164" class="title" clip-path="url(#type)">AI Product Engineer</text>
  <rect x="64" y="134" width="3" height="38" fill="#58a6ff">
    <animate attributeName="x" values="64.0;84.4;104.8;125.2;145.6;166.0;186.4;206.8;227.2;247.6;268.0;288.4;308.8;329.2;349.6;370.0;390.4;410.8;431.2;451.6" keyTimes="0.0000;0.0526;0.1053;0.1579;0.2105;0.2632;0.3158;0.3684;0.4211;0.4737;0.5263;0.5789;0.6316;0.6842;0.7368;0.7895;0.8421;0.8947;0.9474;1.0000" calcMode="discrete" begin="0.7s" dur="1.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="64" y="214" class="sub" opacity="0">I connect company operations to AI agents and MCP servers, and ship products people use.
    <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.6s" fill="freeze"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.40s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="2.40s" dur="0.6s" fill="freeze"/>
    <rect x="64" y="270" width="254" height="78" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="84" y="306" class="num">50%</text>
    <text x="84" y="332" class="lbl">supplier cost cut in a week</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.65s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="2.65s" dur="0.6s" fill="freeze"/>
    <rect x="336" y="270" width="254" height="78" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="356" y="306" class="num">1.6M+</text>
    <text x="356" y="332" class="lbl">customers at Gasable</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.90s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="2.90s" dur="0.6s" fill="freeze"/>
    <rect x="608" y="270" width="254" height="78" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="628" y="306" class="num">10,000+</text>
    <text x="628" y="332" class="lbl">marketplace users</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="3.15s" dur="0.6s" fill="freeze"/>
    <rect x="880" y="270" width="254" height="78" rx="14" fill="#161b22" stroke="#30363d"/>
    <text x="900" y="306" class="num">138</text>
    <text x="900" y="332" class="lbl">productions on Casta</text>
  </g>
</svg>
